# 8GB 友好默认
model:
  unet_name: "z-image\\z-image-turbo-fp8-e4m3fn_量化版_低显加速.safetensors"
  weight_dtype: "fp8_e4m3fn_fast"
  clip_name: "z-image\\qwen_3_4b.safetensors"
  vae_name: "z-image-qwen.safetensors"

model_modes:
  标准 FP8（推荐）:
    backend: fp8
    workflow: txt2img.json
    unet_name: "z-image\\z-image-turbo-fp8-e4m3fn_量化版_低显加速.safetensors"
    weight_dtype: "fp8_e4m3fn_fast"
    clip_name: "z-image\\qwen_3_4b.safetensors"
    tip: "日常首选，速度和效果较均衡"
  极低显存 GGUF:
    backend: gguf
    workflow: txt2img_gguf.json
    unet_name: "z_image_turbo-Q4_K_M.gguf"
    # 文本编码器用 safetensors：当前 ComfyUI-GGUF 不支持 qwen3 架构的 CLIP GGUF
    clip_name: "z-image\\qwen_3_4b.safetensors"
    tip: "更省显存，电脑吃力时用"
  高质量 BF16:
    backend: bf16
    workflow: txt2img.json
    unet_name: "z-image\\z_image_turbo_bf16_完整版_效果更好.safetensors"
    weight_dtype: "default"
    clip_name: "z-image\\qwen_3_4b.safetensors"
    tip: "细节更好，需要更大显存"

# 分辨率档：数字一眼懂（长边像素）；512 面向 6G 边缘卡
quality_presets:
  512 · 省显存:
    long_edge: 512
    steps: 8
    cfg: 1.0
    tip: "6G 友好，不易 OOM"
  720 · 快:
    long_edge: 720
    steps: 8
    cfg: 1.0
    tip: "更快，更省资源"
  1024 · 推荐:
    long_edge: 1024
    steps: 9
    cfg: 1.0
    tip: "默认推荐（8G）"
  1280 · 高清:
    long_edge: 1280
    steps: 9
    cfg: 1.0
    tip: "更清晰"
  1440 · 更高清:
    long_edge: 1440
    steps: 9
    cfg: 1.0
    tip: "更细，更慢、更吃资源"

# 旧标签兼容（图库回填）
quality_legacy_map:
  省显存: 512 · 省显存
  均衡: 1024 · 推荐
  高清: 1280 · 高清

aspect_ratios:
  正方形 1:1: "1:1"
  竖屏 3:4: "3:4"
  竖屏 9:16: "9:16"
  宽屏 4:3: "4:3"
  宽屏 16:9: "16:9"

weight_presets:
  轻 (0.6): 0.6
  中 (0.85): 0.85
  重 (1.0): 1.0

comfy:
  host: "127.0.0.1"
  # 7777 = 本包引擎；8888 = 界面。避开 8188/7860 这类常见占用端口
  port: 7777
  timeout_sec: 300

sampler:
  name: "euler"
  scheduler: "simple"

# 高级 · 自定义尺寸（关 = 仍走 quality_presets 长边）
custom_size:
  min: 256
  max: 2048
  step: 8
  default_width: 1024
  default_height: 1024

# 按 CUDA 总显存建议长边上限（FP8 + 单 LoRA 粗算，可实测校准）
# soft = 建议；hard = 可试但易 OOM（黄字→红字分界）
vram_long_edge:
  # 阈值按「检测显存 GB ≤ 该档」匹配，从低到高
  tiers:
    - { max_vram_gb: 6, soft: 512, hard: 768 }
    - { max_vram_gb: 8, soft: 1024, hard: 1280 }
    - { max_vram_gb: 12, soft: 1280, hard: 1440 }
    - { max_vram_gb: 16, soft: 1440, hard: 1600 }
    - { max_vram_gb: 24, soft: 1600, hard: 2048 }
    - { max_vram_gb: 999, soft: 2048, hard: 2048 }
  # GGUF 建议放宽一档约 +128；BF16 收紧约 -128（在代码里调）
  gguf_bonus: 128
  bf16_penalty: 128
